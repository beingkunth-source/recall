appId: com.recall.app
productName: Recall
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
extraResources:
  - from: assets
    to: assets
  - from: resources/backend
    to: backend
    filter:
      - '**/*'
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Recall
  deleteAppDataOnUninstall: false
